<div class="panier-page">
  <div class="panier__retour">
    <button class="btn-retour" routerLink="/">
      🠔 Retour
    </button>
  </div>

  <div class="panier">
    <h1 class="panier__titre">Mon panier</h1>

    <div class="panier__loading" *ngIf="chargement">
      <p>Chargement...</p>
    </div>

    <div class="panier__erreur" *ngIf="erreur">
      ⚠️ {{ erreur }}
    </div>

   <div class="panier__vide" *ngIf="!chargement && (!commande || commande.reservations.length === 0)">
  <p>Votre panier est vide.</p>
  <a routerLink="/" class="btn-primary">Découvrir les mangas</a>
    </div>

  <div class="panier__liste" *ngIf="commande && commande.reservations.length > 0">
      <div class="panier__item" *ngFor="let ligne of lignesPanier">
      <img [src]="ligne.tome.manga_image" [alt]="ligne.tome.manga_titre" class="panier__image" />
      <div class="panier__infos">
        <span class="panier__manga-titre">{{ ligne.tome.manga_titre }}</span>
        <span class="panier__tome">Tome {{ ligne.tome.numero_tome }}</span>
        <span class="panier__quantite" *ngIf="ligne.ids.length > 1">× {{ ligne.ids.length }}</span>
      </div>
      <div class="panier__prix-bloc">
        <span class="panier__prix">{{ (ligne.tome.prix * ligne.ids.length) | number:'1.2-2' }} €</span>
        <button class="btn-supprimer" (click)="supprimerUnExemplaire(ligne.ids[ligne.ids.length - 1])">
          🗑 Retirer un exemplaire
        </button>
      </div>
    </div>

      <div class="panier__total">
        <span>Total</span>
        <span class="panier__total-prix">{{ commande.total | number:'1.2-2' }} €</span>
      </div>

      <div class="panier__valider">
        <button class="btn-supprimer" (click)="annuler()">
          Annuler la commande
        </button>
        <button class="btn-primary panier__btn-valider" (click)="valider()">
          ✓ Valider
        </button>
      </div>
    </div>
  </div>
</div>
