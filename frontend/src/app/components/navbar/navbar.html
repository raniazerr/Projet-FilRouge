<header class="navbar">
  <div class="navbar__logo">
    <span class="logo-text">MANGA RAKE</span>
  </div>

  <div class="navbar__search">
    <input type="text" placeholder="Rechercher..." [(ngModel)]="searchQuery" />
    <span class="search-icon">🔍</span>
  </div>

  <div class="navbar__actions">
    <!-- Connecté -->
    <ng-container *ngIf="connecte$ | async">
      <a class="navbar__panier" routerLink="/panier">
        <span class="icon">🛒</span>
        <span class="label">Mon panier</span>
        <span class="panier-badge" *ngIf="panierCount > 0">{{ panierCount }}</span>
      </a>
      <a routerLink="/profile">
        <span class="icon">👤</span>
        <span class="label">Mon compte</span>
      </a>
    </ng-container>

    <!-- Non connecté -->
    <ng-container *ngIf="!(connecte$ | async)">
      <a routerLink="/login">
        <span class="icon">👤</span>
        <span class="label">Connexion / Inscription</span>
      </a>
    </ng-container>
  </div>
</header>
