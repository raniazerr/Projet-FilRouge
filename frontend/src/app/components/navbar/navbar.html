<header class="navbar">
  <div class="navbar__logo" routerLink="/">
    <span class="logo-text">MANGA RAKE</span>
  </div>

  <div class="navbar__search">
    <input
      type="text"
      placeholder="Rechercher..."
      [(ngModel)]="searchQuery"
      (input)="onSaisie()"
      (focus)="onSaisie()"
      (blur)="fermerSuggestions()"
      (keyup.enter)="rechercher()" />
    <span class="search-icon" (click)="rechercher()">🔍</span>

    <ul class="navbar__suggestions" *ngIf="suggestionsVisibles">
      <li *ngFor="let manga of suggestions" (mousedown)="choisirSuggestion(manga)">
        <img [src]="manga.image" [alt]="manga.titre" />
        <span>{{ manga.titre }}</span>
      </li>
    </ul>
  </div>

  <div class="navbar__actions">
    <ng-container *ngIf="!(connecte$ | async)">
      <a routerLink="/login">
        <span class="icon">👤</span>
        <span class="label">Connexion / Inscription</span>
      </a>
    </ng-container>

    <!-- Connecté en admin -->
    <ng-container *ngIf="(connecte$ | async) && authService.isAdmin()">
      <a routerLink="/admin/reservations">
        <span class="icon">📦</span>
        <span class="label">Commandes</span>
      </a>
      <a routerLink="/admin/catalogue">
        <span class="icon">➕</span>
        <span class="label">Ajouter un manga</span>
      </a>
      <a routerLink="/profile">
        <span class="icon">👤</span>
        <span class="label">Mon compte</span>
      </a>
    </ng-container>

    <!-- Connecté en simple user -->
    <ng-container *ngIf="(connecte$ | async) && !authService.isAdmin()">
      <a class="navbar__panier" routerLink="/panier">
        <span class="icon">🛒</span>
        <span class="label">Mon panier</span>
        <span class="panier-badge" *ngIf="panierCount > 0">{{ panierCount }}</span>
      </a>
      <a routerLink="/profile">
        <span class="icon">👤</span>
        <span class="label">Mon compte</span>
      </a>
    </ng-container>
  </div>
</header>
