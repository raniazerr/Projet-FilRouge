<!-- Contenu principal -->
<div class="home">

  <!-- Subbar -->
<div class="home__subbar">
  <div class="subbar__social">

      </svg>
      <span>@mangarake_lyon</span>
    </a>
    <a href="https://facebook.com/mangastorylyon/" target="_blank" class="social-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      <span>@mangastorylyon</span>
    </a>
  </div>

  <div class="subbar__separateur"></div>

  <div class="subbar__tris">
    <div class="dropdown" [class.ouvert]="dropdownGenreOuvert">
      <button class="dropdown__btn" (click)="toggleDropdown('genre')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h6v-2H3v2zm0-5h12v-2H3v2zm0-7v2h18V6H3z"/></svg>
        <span>{{ triGenre || 'Par genre' }}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <ul class="dropdown__menu" *ngIf="dropdownGenreOuvert">
        <li (click)="reinitialiser()">Tous</li>
        <li *ngFor="let genre of genres" (click)="filtrerParGenre(genre)">{{ genre }}</li>
      </ul>
    </div>

        <div class="dropdown" [class.ouvert]="dropdownPopOuvert">
      <button class="dropdown__btn" (click)="toggleDropdown('pop')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
        <span>{{ labelPopularite }}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <ul class="dropdown__menu" *ngIf="dropdownPopOuvert">
        <li (click)="trierParPopularite('desc')">Plus réservé</li>
        <li (click)="trierParPopularite('asc')">Moins réservé</li>
      </ul>
    </div>
  </div>
</div>

  <!-- Top 3 -->
  <div class="home__top3" *ngIf="!chargement">
  <div class="top3__header">
    <span class="top3__icon">🔥</span>
    <span class="top3__titre">Les plus populaires</span>
  </div>
  <div class="top3__carousel">
    <button class="top3__arrow top3__arrow--prev" (click)="prevSlide()" *ngIf="peutPrev">❮</button>
    <div class="top3__liste">
      <div class="top3__item" *ngFor="let manga of mangas.slice(0, 3); let i = index"
           [class.active]="i === slideActif">
        <img [src]="manga.image" [alt]="manga.titre" />
        <div class="top3__info">
          <span class="top3__nom">
            <span class="top3__rang">#{{ i + 1 }}</span>
            {{ manga.titre }}
          </span>
          <span class="top3__synopsis">{{ manga.synopsis }}</span>
          <button class="btn-primary" [routerLink]="['/manga', manga.id]">Voir plus</button>
        </div>
      </div>
    </div>
    <button class="top3__arrow top3__arrow--next" (click)="nextSlide()" *ngIf="peutNext">❯</button>
  </div>
</div>


<!-- Chargement -->
<div class="home__loading" *ngIf="chargement">
  <p>Chargement des mangas...</p>
</div>

<!-- Erreur -->
<div class="home__vide" *ngIf="mangas.length === 0 && !chargement && !erreur">
  <p>Aucun manga trouvé.</p>
</div>

  <!-- Grille mangas -->
  <div class="home__grille">
    <div class="manga-card" *ngFor="let manga of mangasFiltres" [routerLink]="['/manga', manga.id]">
      <div class="manga-card__image-wrapper">
        <img [src]="manga.image" [alt]="manga.titre" />
        <div class="manga-card__overlay">
          <span class="manga-card__titre">{{ manga.titre }}</span>
          <button class="btn-primary manga-card__btn">
            🛒 Réserver
          </button>
        </div>
      </div>
      <!-- <div class="manga-card__footer">
        <span class="stock-badge en-stock">✓ En stock</span>
      </div> -->
    </div>
  </div>
</div>
