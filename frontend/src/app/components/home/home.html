<!-- Chargement -->
<div class="home__loading" *ngIf="chargement">
  <p>Chargement des mangas...</p>
</div>

<!-- Erreur -->
<div class="home__vide" *ngIf="erreur">
  <p>Impossible de charger les mangas.</p>
</div>

<!-- Contenu principal -->
<div class="home">

  <!-- Top 3 -->
  <div class="home__top3">
  <div class="top3__header">
    <span class="top3__icon">🔥</span>
    <span class="top3__titre">Les plus populaires</span>
  </div>
  <div class="top3__carousel">
    <button class="top3__arrow top3__arrow--prev" (click)="prevSlide()" *ngIf="peutPrev">❮</button>
    <div class="top3__liste">
      <div class="top3__item" *ngFor="let manga of mangas.slice(0, 3); let i = index"
           [class.active]="i === slideActif">
        <img [src]="manga.image" [alt]="manga.titre" />
        <div class="top3__info">
          <span class="top3__nom">
            <span class="top3__rang">#{{ i + 1 }}</span>
            {{ manga.titre }}
          </span>
          <span class="top3__synopsis">{{ manga.synopsis }}</span>
          <button class="btn-primary">Voir plus</button>
        </div>
      </div>
    </div>
    <button class="top3__arrow top3__arrow--next" (click)="nextSlide()" *ngIf="peutNext">❯</button>
  </div>
</div>

  <!-- Grille mangas -->
  <div class="home__grille">
    <div class="manga-card" *ngFor="let manga of mangas">
      <div class="manga-card__image-wrapper">
        <img [src]="manga.image" [alt]="manga.titre" />
        <div class="manga-card__overlay">
          <span class="manga-card__titre">{{ manga.titre }}</span>
          <button class="btn-primary manga-card__btn">
            🛒 Réserver
          </button>
        </div>
      </div>
      <div class="manga-card__footer">
        <span class="stock-badge en-stock">✓ En stock</span>
      </div>
    </div>
  </div>

  <!-- Aucun manga -->
  <div class="home__vide" *ngIf="mangas.length === 0">
    <p>Aucun manga trouvé.</p>
  </div>

</div>
