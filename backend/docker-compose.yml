services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mangarake
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DEFAULT_URI: "http://localhost"
      DATABASE_URL: "mysql://root:root@db:3306/mangarake?serverVersion=8.0&charset=utf8mb4"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-changeme}
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      CORS_ALLOW_ORIGIN: '^https?://localhost(:[0-9]+)?$'
    ports:
      - "8000:80"
    volumes:
      - jwt_keys:/var/www/html/config/jwt

  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db_data:
  jwt_keys: