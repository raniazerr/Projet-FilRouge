name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-tests:
    name: Backend (Symfony / PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mangarake_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_mysql, mbstring
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create .env.test.local
        run: |
          echo "APP_ENV=test" >> .env.test.local
          echo "APP_SECRET=ci_secret" >> .env.test.local
          echo "DEFAULT_URI=http://localhost" >> .env.test.local
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/mangarake_test?serverVersion=8.0&charset=utf8mb4" >> .env.test.local
          echo "MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0" >> .env.test.local
          echo "MAILER_DSN=null://null" >> .env.test.local
          echo "JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem" >> .env.test.local
          echo "JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem" >> .env.test.local
          echo "JWT_PASSPHRASE=ci_test_passphrase" >> .env.test.local
          echo "CORS_ALLOW_ORIGIN=^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$" >> .env.test.local

      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genrsa -aes256 -passout pass:ci_test_passphrase -out config/jwt/private.pem 4096
          openssl rsa -in config/jwt/private.pem -passin pass:ci_test_passphrase -pubout -out config/jwt/public.pem

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent && break
            sleep 2
          done

      - name: Create database schema
        run: php bin/console doctrine:schema:create --env=test --no-interaction

  frontend-build:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Pas encore de tests unitaires configurés côté Angular (aucun *.spec.ts,
      # aucun builder "test" dans angular.json). En attendant, on vérifie au moins
      # que le projet compile. Dès que des specs existeront, remplacer par :
      # npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build (compile check)
        run: npm run build